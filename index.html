<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิว - Queue Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        .btn-print {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-print:hover {
            background-color: #1d4ed8;
        }

        /* รูปแบบใบตั๋วสำหรับ window.print() (Fallback) */
        #ticket-print-area {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #ticket-print-area, #ticket-print-area * {
                visibility: visible;
            }
            #ticket-print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm; /* ขนาดกระดาษ Sunmi V2 */
                padding: 10px;
                font-family: monospace;
                text-align: center;
            }
            .ticket-title { font-size: 16px; font-weight: bold; }
            .ticket-divider { border-top: 1px dashed #000; margin: 8px 0; }
            .ticket-number { font-size: 32px; font-weight: bold; margin: 10px 0; }
            .ticket-info { font-size: 12px; margin: 4px 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ระบบกดรับคิว</h1>
        
        <div class="form-group">
            <label for="queue-type">ประเภทคิว</label>
            <select id="queue-type">
                <option value="A">โต๊ะเล็ก (1-2 ท่าน)</option>
                <option value="B">โต๊ะกลาง (3-4 ท่าน)</option>
                <option value="C">โต๊ะใหญ่ (5 ท่านขึ้นไป)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="guest-count">จำนวนลูกค้า (คน)</label>
            <input type="number" id="guest-count" value="2" min="1" max="20">
        </div>

        <button class="btn-print" onclick="handleIssueQueue()">พิมพ์บัตรคิว</button>
    </div>

    <!-- เลย์เอาต์สลิปสำรองสำหรับ window.print -->
    <div id="ticket-print-area">
        <div class="ticket-title">Pancake Café</div>
        <div class="ticket-divider"></div>
        <div class="ticket-info">หมายเลขคิวของคุณ</div>
        <div class="ticket-number" id="p-number">A001</div>
        <div class="ticket-info" id="p-desc">โต๊ะเล็ก (1-2 ท่าน)</div>
        <div class="ticket-info" id="p-count">จำนวน: 2 ท่าน</div>
        <div class="ticket-divider"></div>
        <div class="ticket-info" id="p-waiting">จำนวนคิวก่อนหน้า: 0 คิว</div>
        <div class="ticket-info" id="p-time">เวลา: --:--</div>
        <br>
        <div class="ticket-info">ขอบคุณที่ใช้บริการ</div>
    </div>

    <script>
        let currentQueueNumber = 1;

        async function handleIssueQueue() {
            const type = document.getElementById('queue-type').value;
            const count = document.getElementById('guest-count').value;
            const typeText = document.getElementById('queue-type').options[document.getElementById('queue-type').selectedIndex].text;
            
            const queueNo = type + String(currentQueueNumber).padStart(3, '0');
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            const queueData = {
                number: queueNo,
                desc: typeText,
                count: count,
                time: timeStr
            };

            const waitingCount = Math.floor(Math.random() * 3); // สมมุติตัวเลขคิวก่อนหน้า

            // เรียกใช้ฟังก์ชันสั่งพิมพ์
            await printQueueTicket(queueData, waitingCount);

            currentQueueNumber++;
        }

        async function printQueueTicket(queue, waitingCount) {
            // 1. จัดรูปแบบโครงสร้างข้อมูลส่งไปยัง Sunmi Local Print Agent (Port 8080)
            const printData = {
                text: [
                    { content: "Pancake Café\n", align: "center", size: "large", bold: true },
                    { content: "--------------------------------\n", align: "center" },
                    { content: "หมายเลขคิวของคุณ\n", align: "center", size: "small" },
                    { content: `${queue.number}\n`, align: "center", size: "xlarge", bold: true },
                    { content: `${queue.desc}\n`, align: "center", bold: true },
                    { content: `จำนวนลูกค้า: ${queue.count} ท่าน\n`, align: "center" },
                    { content: "--------------------------------\n", align: "center" },
                    { content: `จำนวนคิวก่อนหน้า: ${waitingCount} คิว\n`, align: "center" },
                    { content: `เวลา: ${queue.time}\n\n`, align: "center" },
                    { content: "ขอบคุณที่ใช้บริการ\n\n\n\n", align: "center", bold: true }
                ]
            };

            try {
                // 2. ยิงคำสั่งพิมพ์เข้า Local Service
                const response = await fetch("http://127.0.0.1:8080/print", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(printData)
                });

                if (!response.ok) {
                    throw new Error("Sunmi Print Agent Not Responding");
                }
                console.log("พิมพ์บัตรคิวผ่าน Sunmi Local Service สำเร็จ");
            } catch (error) {
                // 3. หาก Local Service ไม่ตอบสนอง สลับไปใช้ window.print() สำรอง
                console.warn("ไม่สามารถเชื่อมต่อ Local Service ได้ ใช้ fallback window.print():", error);
                
                document.getElementById('p-number').innerText = queue.number;
                document.getElementById('p-desc').innerText = queue.desc;
                document.getElementById('p-count').innerText = `จำนวน: ${queue.count} ท่าน`;
                document.getElementById('p-waiting').innerText = `จำนวนคิวก่อนหน้า: ${waitingCount} คิว`;
                document.getElementById('p-time').innerText = `เวลา: ${queue.time}`;

                const printArea = document.getElementById('ticket-print-area');
                printArea.style.display = 'block';
                window.print();
                printArea.style.display = 'none';
            }
        }
    </script>
</body>
</html>
