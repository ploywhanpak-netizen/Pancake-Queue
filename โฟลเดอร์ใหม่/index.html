<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pancake Cafe Queue System</title>
  <style>
    * { box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
    body { padding: 15px; background-color: #f4f6f8; margin: 0; }
    h2 { text-align: center; color: #333; margin-top: 5px; }
    
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .card-title { font-weight: bold; font-size: 1.1em; margin-bottom: 10px; color: #444; }
    
    .grid-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; color: white; transition: 0.2s; }
    
    .btn-green { background-color: #2e7d32; }
    .btn-blue { background-color: #0288d1; }
    .btn-orange { background-color: #ed6c02; }
    .btn-red { background-color: #d32f2f; }
    
    .calling-display { text-align: center; padding: 15px; background: #e8f5e9; border-radius: 8px; font-size: 2rem; font-weight: bold; color: #2e7d32; margin-bottom: 10px; }
    .action-group { display: flex; gap: 8px; margin-top: 10px; }
    .action-group button { flex: 1; font-size: 0.9rem; }
    
    .queue-list { list-style: none; padding: 0; margin: 0; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #eee; }
    .queue-item:last-child { border-bottom: none; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Pancake Cafe Queue 🥞</h2>

  <!-- 1. ส่วนออกคิวใหม่ -->
  <div class="card">
    <div class="card-title">1. ออกคิวใหม่ (เลือกจำนวนคน)</div>
    <div class="grid-btn">
      <button class="btn-green" onclick="addQueue('A', '1-2 ท่าน')">+ คิว A (1-2 ท่าน)</button>
      <button class="btn-green" onclick="addQueue('B', '3-4 ท่าน')">+ คิว B (3-4 ท่าน)</button>
      <button class="btn-green" onclick="addQueue('C', '5-6 ท่าน')">+ คิว C (5-6 ท่าน)</button>
      <button class="btn-green" onclick="addQueue('D', '7+ ท่าน')">+ คิว D (7+ ท่าน)</button>
    </div>
  </div>

  <!-- 2. ส่วนเรียกคิว -->
  <div class="card">
    <div class="card-title">2. คิวกำลังเรียก</div>
    <div id="currentCallDisplay" class="calling-display">---</div>
    
    <button class="btn-blue" style="width: 100%; font-size: 1.1rem;" onclick="callNextQueue()">เรียกคิวถัดไป</button>
    
    <div class="action-group">
      <button class="btn-green" onclick="completeCurrentQueue()">รับบริการแล้ว</button>
      <button class="btn-orange" onclick="skipCurrentQueue()">ข้ามคิวนี้</button>
      <button class="btn-red" onclick="cancelCurrentQueue()">ยกเลิกคิว</button>
    </div>
  </div>

  <!-- 3. รายการคิวที่ถูกข้าม -->
  <div class="card">
    <div class="card-title">3. รายการคิวที่ถูกข้าม (<span id="skippedCount">0</span>)</div>
    <ul id="skippedList" class="queue-list"></ul>
  </div>

  <!-- 4. รายการคิวมารอ -->
  <div class="card">
    <div class="card-title">4. รายการคิวมารอ (<span id="waitingCount">0</span> คิว)</div>
    <ul id="waitingList" class="queue-list"></ul>
  </div>

  <!-- Hidden iframe สำหรับยิงคำสั่งพิมพ์โดยไม่เปลี่ยนหน้าเว็บ -->
  <iframe id="printFrame" style="display:none;"></iframe>

<script>
  let queueData = JSON.parse(localStorage.getItem('cafe_queue_data')) || {
    counters: { A: 1, B: 1, C: 1, D: 1 },
    waiting: [],
    skipped: [],
    current: null
  };

  function saveData() {
    localStorage.setItem('cafe_queue_data', JSON.stringify(queueData));
    updateUI();
  }

  // ระบบยิงคำสั่งพิมพ์เข้า Sunmi InnerPrinter โดยตรง
  function printSunmi(text) {
    // 1. ตรวจสอบ JavaScript Interface จากแอปเบราว์เซอร์
    if (window.SunmiPrinter && typeof window.SunmiPrinter.printText === "function") {
      window.SunmiPrinter.printText(text);
      window.SunmiPrinter.lineWrap(3);
      return;
    } 
    if (window.Android && typeof window.Android.printText === "function") {
      window.Android.printText(text);
      return;
    }

    // 2. ยิงผ่าน Sunmi InnerPrinter Intent Protocol (ทำงานได้โดยตรงบน Sunmi OS)
    try {
      const intentUrl = "intent://print#Intent;scheme=sunmi;package=com.sunmi.innerprinter;S.text=" + encodeURIComponent(text) + ";end";
      const iframe = document.getElementById('printFrame');
      if (iframe) {
        iframe.src = intentUrl;
      } else {
        window.location.href = intentUrl;
      }
    } catch (e) {
      console.log("Print Error:", e);
    }
  }

  // 1. ออกคิวใหม่
  function addQueue(type, desc) {
    const number = type + String(queueData.counters[type]).padStart(3, '0');
    queueData.counters[type]++;
    
    const newItem = {
      number: number,
      typeDesc: desc,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
    };

    queueData.waiting.push(newItem);
    saveData();

    // ข้อความที่จะส่งพิมพ์เข้า Sunmi
    const slipText = 
      "==============================\n" +
      "       Pancake Cafe Queue     \n" +
      "==============================\n" +
      "หมายเลขคิว : " + newItem.number + "\n" +
      "ประเภท     : " + newItem.typeDesc + "\n" +
      "เวลา       : " + newItem.time + "\n" +
      "==============================\n" +
      "   กรุณารอเรียกหมายเลขคิว ขอบคุณค่ะ  \n\n\n\n\n";
    
    printSunmi(slipText);
  }

  // 2. เรียกคิวถัดไป
  function callNextQueue() {
    if (queueData.waiting.length === 0) {
      alert("ไม่มีคิวรอในระบบ");
      return;
    }
    queueData.current = queueData.waiting.shift();
    saveData();
  }

  // 3. ข้ามคิว
  function skipCurrentQueue() {
    if (!queueData.current) return;
    queueData.skipped.push(queueData.current);
    queueData.current = null;
    saveData();
  }

  // 4. ดึงคิวที่ข้ามกลับมารับบริการ
  function recallSkipped(index) {
    const recalled = queueData.skipped.splice(index, 1)[0];
    queueData.waiting.unshift(recalled);
    saveData();
  }

  // 5. รับบริการเรียบร้อย
  function completeCurrentQueue() {
    if (!queueData.current) return;
    queueData.current = null;
    saveData();
  }

  // 6. ยกเลิกคิว
  function cancelCurrentQueue() {
    if (!queueData.current) return;
    queueData.current = null;
    saveData();
  }

  // อัปเดตหน้าจอ UI
  function updateUI() {
    const display = document.getElementById('currentCallDisplay');
    if (queueData.current) {
      display.innerText = queueData.current.number + " (" + queueData.current.typeDesc + ")";
    } else {
      display.innerText = "---";
    }

    document.getElementById('waitingCount').innerText = queueData.waiting.length;
    const waitingList = document.getElementById('waitingList');
    waitingList.innerHTML = '';
    queueData.waiting.forEach(item => {
      waitingList.innerHTML += `<li class="queue-item"><span><b>${item.number}</b> (${item.typeDesc})</span><small>${item.time}</small></li>`;
    });

    document.getElementById('skippedCount').innerText = queueData.skipped.length;
    const skippedList = document.getElementById('skippedList');
    skippedList.innerHTML = '';
    queueData.skipped.forEach((item, index) => {
      skippedList.innerHTML += `
        <li class="queue-item">
          <span><b>${item.number}</b> (${item.typeDesc})</span>
          <button class="btn-blue btn-sm" onclick="recallSkipped(${index})">เรียกซ้ำ</button>
        </li>`;
    });
  }

  updateUI();
</script>

</body>
</html>
